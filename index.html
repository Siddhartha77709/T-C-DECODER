<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="T&C Decoder" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <title>T&amp;C Decoder — Legal AI &amp; Rights Protection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function () {
        'use strict';
        var KILL_LEGACY_SW = true;
        var EXPECTED_SW_PATH = '/sw.js';
        var markKey = '__tanc_sw_mobile_cleanup_done';
        try {
          if (window.performance && performance.navigation && performance.navigation.type === 1) {
            KILL_LEGACY_SW = true;
          }
        } catch (_) {}
        function report(level, msg, extra) {
          var pfx = '[SW Boot · Mobile Guard]';
          try {
            if (level === 'error') console.error(pfx, msg, extra || '');
            else if (level === 'warn') console.warn(pfx, msg, extra || '');
            else console.info(pfx, msg, extra || '');
          } catch (_) {}
        }
        if ('serviceWorker' in navigator && KILL_LEGACY_SW) {
          try {
            var ua = (navigator.userAgent || '').toLowerCase();
            var isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|mobile safari|fban|fbav/i.test(ua);
            var doUnregAll = isMobile;
            try {
              if (window.sessionStorage && sessionStorage.getItem('tanc_sw_reload_once') === '1') {
                doUnregAll = true;
              }
            } catch (_) {}
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var count = 0;
              var tasks = regs.map(function (reg) {
                try {
                  var scope = (reg && reg.scope) || '';
                  var a = (reg.active && reg.active.scriptURL) || '';
                  var w = (reg.waiting && reg.waiting.scriptURL) || '';
                  var i = (reg.installing && reg.installing.scriptURL) || '';
                  var anyUrl = a || w || i;
                  var isExpected = anyUrl.indexOf(EXPECTED_SW_PATH) !== -1;
                  var shouldNuke = doUnregAll || !isExpected;
                  if (shouldNuke) {
                    return reg.unregister().then(function (ok) {
                      if (ok) count++;
                      report(ok ? 'warn' : 'error', (ok ? 'Unregistered ' : 'Failed to unregister ') + (isExpected ? 'existing' : 'legacy/orphan') + ' SW: ' + scope, anyUrl || '(no script)');
                      return ok;
                    }).catch(function (err) {
                      report('error', 'Error while unregistering SW for scope: ' + scope, err);
                      return false;
                    });
                  } else {
                    try { reg.update().catch(function () {}); } catch (_) {}
                    report('info', 'Keeping expected SW, update() invoked: ' + scope);
                    return Promise.resolve(false);
                  }
                } catch (e) {
                  report('error', 'Per-registration iteration error', e);
                  return Promise.resolve(false);
                }
              });
              Promise.all(tasks).then(function () {
                try {
                  if (count > 0 && 'caches' in window) {
                    caches.keys().then(function (keys) {
                      return Promise.all(keys.filter(function (k) {
                        return k.indexOf('tanc-decoder-v6') === -1;
                      }).map(function (k) {
                        try { return caches.delete(k).catch(function () { return false; }); }
                        catch (_) { return false; }
                      }));
                    }).catch(function () {});
                  }
                } catch (_) {}
                try {
                  if (count > 0 && window.sessionStorage && sessionStorage.getItem(markKey) !== '1') {
                    sessionStorage.setItem(markKey, '1');
                    sessionStorage.setItem('tanc_sw_reload_once', '1');
                    report('warn', 'Nuked ' + count + ' stale SW(s). Reloading to obtain fresh code...');
                    window.location.reload();
                  }
                } catch (_) {}
              }).catch(function (err) {
                report('error', 'Top-level SW cleanup promise failed', err);
              });
            }).catch(function (err) {
              report('error', 'getRegistrations() failed', err);
            });
          } catch (topErr) {
            report('error', 'Fatal SW boot guard error — proceeding to app boot anyway.', topErr);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-[#F4F6FA] text-[#0D1117] font-sans antialiased m-0 p-0 overflow-x-hidden selection:bg-brand-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
